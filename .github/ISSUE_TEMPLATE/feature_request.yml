name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: dropdown
    id: tv
    attributes:
      label: Which TVs does it apply to?
      multiple: true
      options: [Google TV, Android TV, Roku TV, Fire TV, All]
