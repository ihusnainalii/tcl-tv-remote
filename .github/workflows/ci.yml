name: CI

# Staged pipeline. Each job is a required check on main, so a PR merges only when all pass:
#   Lint -> Build -> Tests -> Coverage
#                         -> App bundle
#                         -> iOS app

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_MIN: 90   # TVKit line coverage floor (currently ~97%)

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          command -v swiftgen >/dev/null || brew install swiftgen
      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: SwiftGen output is up to date
        run: |
          swiftgen config run
          git diff --exit-code -- Sources/RemoteUI/Generated || {
            echo "::error title=SwiftGen out of date::Run 'swiftgen' and commit Sources/RemoteUI/Generated"; exit 1; }

  build:
    name: Build
    needs: lint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile package and tests
        run: swift build --build-tests

  test:
    name: Tests
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test --parallel --enable-code-coverage --xunit-output .build/tests.xml

      - name: Report test results
        if: always()   # annotate failures on the PR even when tests fail
        run: python3 scripts/ci_report.py tests .build/tests.xml .build/tests-swift-testing.xml

      - name: Collect coverage data
        if: success()
        run: cp "$(swift test --show-codecov-path)" coverage.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: .build/tests*.xml
          if-no-files-found: ignore

      - name: Upload coverage data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest   # just reads the report; no need for a Mac
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Coverage gate
        run: python3 scripts/ci_report.py coverage coverage.json --min "$COVERAGE_MIN"

  ios:
    name: iOS app
    needs: test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        run: cd iOS && xcodegen generate
      - name: Build for iPhone and iPad (Simulator)
        run: |
          cd iOS
          xcodebuild -project TCLRemote.xcodeproj -scheme "TCL Remote iOS" \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../.build/ios \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build Apple Watch app
        run: |
          cd iOS
          xcodebuild -project TCLRemote.xcodeproj -scheme "TCL Remote watchOS" \
            -destination 'generic/platform=watchOS' -derivedDataPath ../.build/watch \
            CODE_SIGNING_ALLOWED=NO -quiet build

  app:
    name: App bundle
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: scripts/build.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "TCL Remote.app" TCLRemote.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TCLRemote-app
          path: build/TCLRemote.zip
